function handleLayerAddition() {
    const layerName = document.getElementById('layerSelect').value;

    if (!layerName) {
        alert("Veuillez sélectionner une couche dans la liste.");
        return;
    }

    updateLegend(layerName);
    updateSource(layerName);

    // On vérifie dans quelle liste se trouve la couche
    if (layersWFS.includes(layerName)) {
        console.log("Mode WFS détecté pour :", layerName);
        addWFSLayer(urlParams.get('lat'), urlParams.get('lon'), layerName);
    } 
    else if (layersWMS.includes(layerName)) {
        console.log("Mode WMS détecté pour :", layerName);
        addWMSLayer();
    } 
    else {
        // Optionnel : Comportement par défaut si la couche n'est dans aucune liste
        console.warn("La couche n'est pas répertoriée, utilisation du WMS par défaut.");
        addWMSLayer();
    }
}

// 1. Les couches à CACHER (Liste noire)
const hiddenLayers = [
    'vue_pluie_vecteur',  // Celle avec les gros carrés lourds
    'ind_ind_atmo',         
];

// 2. Les couches à RENOMMER (Dictionnaire)
// "Nom_Technique_GeoServer" : "Joli Nom à Afficher"
const layerNiceNames = {
    'meteo_vigilance_live': '🌩️ Vigilance Météo (Direct)',
    'inondation': '💧 Zones Inondables (PPRI)',
    'Debroussaillement_light': '🔥 Obligation Débroussaillement',
    'vue_atmo_complete': '🌫️ Qualité de l\'Air',
    'pluie': '☔ Pluie (Radar Météo France)'
};

async function loadLayers() {
    const url = '/geoserver/rest/workspaces/webmapping/layers.json';
    const auth = btoa('admin:webmapping2026'); 

    const select = document.getElementById('layerSelect');
    if (!select) return;

    select.innerHTML = '<option>Chargement...</option>';

    try {
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Authorization': `Basic ${auth}`,
                'Accept': 'application/json'
            }
        });

        if (!response.ok) throw new Error("Erreur serveur");

        const data = await response.json();
        const layers = data.layers.layer;

        select.innerHTML = ''; // On vide le select
        
        // Option par défaut
        const defaultOption = document.createElement('option');
        defaultOption.value = "";
        defaultOption.textContent = "-- Choisir une couche --";
        select.appendChild(defaultOption);

        if (layers && layers.length > 0) {
            layers.forEach(layer => {
                
                // FILTRE : Si la couche est dans la liste noire, on la saute (continue)
                if (hiddenLayers.includes(layer.name)) {
                    return; 
                }

                const option = document.createElement('option');
                
                // IMPORTANT : La valeur reste le nom technique (pour que le code marche)
                option.value = layer.name; 
                
                // AFFICHAGE : On regarde dans le dictionnaire, sinon on garde le nom technique
                if (layerNiceNames[layer.name]) {
                    option.textContent = layerNiceNames[layer.name];
                } else {
                    option.textContent = layer.name; // Fallback si pas de joli nom défini
                }
                
                select.appendChild(option);
            });
        }

    } catch (error) {
        console.error("Erreur:", error);
        select.innerHTML = '<option disabled>Erreur de connexion</option>';
    }
}
      
let wfsLayer = null; // Pour pouvoir effacer le polygone précédent


async function addWFSLayer(lat, lon, layerName) {
    const baseURL = "/geoserver/webmapping/wfs";

    // 1. ON DÉFINIT LA VARIABLE MANQUANTE !
    // On remet le filtre pour que la vigilance ne charge QUE le département sous le point.
    // Rappel : Ordre Longitude Latitude pour WFS 1.0.0
    // On précise SRID=4326 pour dire à GeoServer : "Attention, ce sont des coordonnées GPS !"
const cqlFilter = `INTERSECTS(geom, SRID=4326;POINT(${lon} ${lat}))`;

    const params = new URLSearchParams({
        service: 'WFS',
        version: '1.0.0', 
        request: 'GetFeature',
        typeName: `webmapping:${layerName}`,
        outputFormat: 'application/json',
        srsName: 'EPSG:4326',
        CQL_FILTER: cqlFilter // <--- Maintenant, la variable existe juste au-dessus !
    });

    const fullURL = `${baseURL}?${params.toString()}`;
    console.log("Chargement WFS filtré :", fullURL);

    try {
        const response = await fetch(fullURL);

        if (!response.ok) {
            console.error("Erreur GeoServer");
            return;
        }

        const data = await response.json();

        // Nettoyage de l'ancienne couche
// 1. On efface l'ancien WFS (ça tu l'avais déjà)
        if (wfsLayer) {
            map.removeLayer(wfsLayer);
            wfsLayer = null;
        }

        // 2. AJOUT : On efface aussi l'ancien WMS (Débroussaillement/Inondation/Pluie) !
        if (wmsLayer) {
            map.removeLayer(wmsLayer);
            wmsLayer = null;
        }

        if (data.features && data.features.length > 0) {
           wfsLayer = L.geoJSON(data, {
                
                style: function(feature) {
                    // CAS 1 : VIGILANCE METEO
                    if (layerName.includes('vigilance')) {
                        const niveau = feature.properties.niveau_vigilance;
                        let codeCouleur = 'green';
                        if (niveau == 2) codeCouleur = '#FFD700'; // Jaune
                        if (niveau == 3) codeCouleur = 'orange';  // Orange
                        if (niveau == 4) codeCouleur = 'red';     // Rouge
                        return { 
                            color: codeCouleur, 
                            fillColor: codeCouleur, 
                            weight: 3, 
                            fillOpacity: 0.4 
                        };
                    }
                    if (layerName.includes('atmo')) {
                        const niveau = feature.properties.code_qual;
                        let codeCouleur1 = '#50f0e6';
                        if (niveau == 2) codeCouleur1 = '#63bda4';
                        if (niveau == 3) codeCouleur1 = '#efe643';
                        if (niveau == 4) codeCouleur1 = '#ea5254';
                        if (niveau == 5) codeCouleur1 = '#951636';
                        if (niveau == 6) codeCouleur1 = '#882081';
                        return { 
                            color: codeCouleur1, 
                            fillColor: codeCouleur1, 
                            weight: 3, 
                            fillOpacity: 0.4 
                        };
                    }
                    // Autres cas WFS éventuels...
                    return { color: 'gray', weight: 2, fillOpacity: 0.4 };
                },

                onEachFeature: function(feature, layer) {
                     if(feature.properties.nom_officiel) {
                        layer.bindPopup(feature.properties.nom_officiel);
                     }
                }
            }).addTo(map);

            console.log("✅ Couche Vigilance (Département) chargée !");
            map.fitBounds(wfsLayer.getBounds());

        } else {
            alert("Aucune donnée de vigilance trouvée pour votre position.");
        }

    } catch (error) {
        console.error("Erreur JS :", error);
    }
}
            // Fonction pour ajouter une couche WMS
       function addWMSLayer() {
    const wmsUrl = "/geoserver/webmapping/wms"; // Ton URL propre
    const layerName = document.getElementById('layerSelect').value;

    if (!layerName) {
        alert('Veuillez sélectionner une couche.');
        return;
    }

    // Nettoyage WFS si besoin (pour éviter d'avoir les 2 en même temps)
    if (typeof wfsLayer !== 'undefined' && wfsLayer) {
        map.removeLayer(wfsLayer);
        wfsLayer = null;
    }
    // Nettoyage WMS précédent
    if (wmsLayer) {
        map.removeLayer(wmsLayer);
    }
    
    // Ajout de la couche WMS
    wmsLayer = L.tileLayer.wms(wmsUrl, {
        layers: `webmapping:${layerName}`, // Ajout auto du workspace
        format: 'image/png',
        transparent: true,  // <--- C'est ça qui active la transparence du PNG
        version: '1.1.0',
        attribution: 'GeoServer',
        tiled: true
    }).addTo(map);
    
    console.log("Couche WMS ajoutée :", layerName);
}

   async function infoVigilance(lat, lon) {
    // 1. Configuration de la requête WFS
    const baseURL = "/geoserver/webmapping/wfs";
    // Rappel : Ordre Longitude Latitude pour GeoServer
    const cqlFilter = `INTERSECTS(geom, SRID=4326;POINT(${lon} ${lat}))`;

    const params = new URLSearchParams({
        service: 'WFS',
        version: '2.0.0',
        request: 'GetFeature',
        typeNames: `webmapping:meteo_vigilance_live`, // Ton nom de couche
        outputFormat: 'application/json',
        CQL_FILTER: cqlFilter
    });

    try {
        const response = await fetch(`${baseURL}?${params.toString()}`);
        const data = await response.json();

        // On récupère la balise HTML une seule fois
        const divVigilance = document.getElementById('etatvigilance');

        // 2. Traitement des données
        if (data.features && data.features.length > 0) {
            
            // Récupération des propriétés (Vérifie bien ces noms dans ta console !)
            const props = data.features[0].properties;
            const zone = props.nom_officiel;        
            const niveau = props.niveau_vigilance;  
            const risques = props.risques_meteo;   

            // Gestion des couleurs
            let couleurTexte = "Verte";
            let styleColor = "green";

            if (niveau == 2) { couleurTexte = "Jaune"; styleColor = "#FFD700"; } // Jaune Or
            if (niveau == 3) { couleurTexte = "Orange"; styleColor = "orange"; }
            if (niveau == 4) { couleurTexte = "ROUGE"; styleColor = "red"; }

            // Affichage dans le panneau
            if (divVigilance) {
                divVigilance.innerHTML = 
                    `Département : <b>${zone}</b><br>` +
                    `Niveau : <b style="color:${styleColor}; font-size:1.2em;">${couleurTexte}</b><br>` +
                    `<small>Risques : ${risques}</small>`;
            } 

        } else {
            // Cas où on est hors zone ou pas de données
            if (divVigilance) {
                divVigilance.innerHTML = "Zone hors vigilance Météo France";
            }
        }

    } catch (error) {
        console.error('Erreur Info Vigilance :', error);
    }
}

async function infoInondation(lat, lon) {
    const baseURL = "/geoserver/webmapping/wfs";
    
    // Toujours l'ordre Longitude Latitude pour GeoServer !
    const cqlFilter = `INTERSECTS(geom, POINT(${lon} ${lat}))`;

    const params = new URLSearchParams({
        service: 'WFS',
        version: '1.0.0', // On reste en 1.0.0 c'est plus sûr pour les points
        request: 'GetFeature',
        typeName: `webmapping:inondation`, // ⚠️ VERIFIE CE NOM (inondation ou Debroussaillement_light ?)
        outputFormat: 'application/json',
        srsName: 'EPSG:4326',
        CQL_FILTER: cqlFilter
    });

    try {
        const response = await fetch(`${baseURL}?${params.toString()}`);
        const data = await response.json();
        
        const divInfo = document.getElementById('infoInondation');

        // LA LOGIQUE EST ICI :
        if (data.features && data.features.length > 0) {
            // SCÉNARIO 1 : Le point EST dans la zone
            // On peut mettre du rouge pour alerter
            divInfo.innerHTML = `⚠️ <b>ATTENTION :</b> Vous êtes en zone inondable.`;
            divInfo.style.color = "red"; 
            divInfo.style.backgroundColor = "#ffe6e6"; // Fond rouge très clair
            divInfo.style.padding = "10px";
            divInfo.style.borderRadius = "5px";

        } else {
            // SCÉNARIO 2 : Le point N'EST PAS dans la zone (Tableau vide)
            divInfo.innerHTML = `✅ Zone non inondable.`;
            divInfo.style.color = "green";
            divInfo.style.backgroundColor = "transparent";
            divInfo.style.padding = "0";
        }

    } catch (error) {
        console.error('Erreur Info Inondation : ', error);
    }
}

            // Affiche des infos On click
                map.on('click', function (e) {

        if (!wmsLayer) return;

        const point = map.latLngToContainerPoint(e.latlng, map.getZoom());
        const size = map.getSize();

        const params = {
            request: 'GetFeatureInfo',
            service: 'WMS',
            srs: 'EPSG:4326',
            styles: '',
            transparent: true,
            version: '1.1.1',
            format: 'image/png',
            bbox: map.getBounds().toBBoxString(),
            height: size.y,
            width: size.x,
            layers: wmsLayer.options.layers,
            query_layers: wmsLayer.options.layers,
            info_format: 'application/json',
            x: Math.floor(point.x),
            y: Math.floor(point.y)
        };

        const url = wmsLayer._url + L.Util.getParamString(params);

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.features && data.features.length > 0) {
                    const props = data.features[0].properties;

                    let content = '<b>Informations :</b><br>';
                    for (let key in props) {
                        content += `${key} : ${props[key]}<br>`;
                    }

                    L.popup()
                        .setLatLng(e.latlng)
                        .setContent(content)
                        .openOn(map);
                }
            });
        });




    </script>
