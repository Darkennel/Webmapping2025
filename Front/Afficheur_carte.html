<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur WMS GeoServer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="StyleAfficheurCarte.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
</head>
<body>
    <div id="map"></div>
    
    <div class="controls">
        <h3>Ajouter une couche WMS</h3>
        
        <label>URL du serveur WMS :</label>
        <input type="text" id="wmsUrl" value="http://100.81.197.4:8080/geoserver/wms">
        
        <label for="layerName">Nom de la couche :</label>
        <label for="layerSelect">Couche WMS :</label>
        <select id="layerSelect">
            <option value="">Chargement des couches...</option>
        </select>
        
        <button onclick=    handleLayerAddition()>Ajouter la couche</button>
    </div>

    <script>
        // Lire les paramètres dans l'URL
        const urlParams = new URLSearchParams(window.location.search); // utilisation des coordonnées passées en paramètres de l'url
        const lat = urlParams.get('lat');
        const lon = urlParams.get('lon');
        // Initialiser la carte
        const map = L.map('map').setView([lat, lon], 13);

        // Ajouter le fond de carte OpenStreetMap
         L.tileLayer('https://cartodb-basemaps-a.global.ssl.fastly.net/light_all/{z}/{x}/{y}.jpg', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        let wmsLayer = null;

        // Tri des couches suivant WMS et WFS 
        // Vos listes de couches (noms techniques GeoServer)
const layersWFS = [
    'vue_atmo_complete',
    'meteo_vigilance_live'
];

const layersWMS = [
    'Debroussaillement_light',
    'inondation',
    'pluie'
];

function handleLayerAddition() {
    const layerName = document.getElementById('layerSelect').value;

    if (!layerName) {
        alert("Veuillez sélectionner une couche dans la liste.");
        return;
    }

    // On vérifie dans quelle liste se trouve la couche
    if (layersWFS.includes(layerName)) {
        console.log("Mode WFS détecté pour :", layerName);
        addWFSLayer(urlParams.get('lon'),urlParams.get('lat'),layerName);
    } 
    else if (layersWMS.includes(layerName)) {
        console.log("Mode WMS détecté pour :", layerName);
        addWMSLayer();
    } 
    else {
        // Optionnel : Comportement par défaut si la couche n'est dans aucune liste
        console.warn("La couche n'est pas répertoriée, utilisation du WMS par défaut.");
        addWMSLayer();
    }
}

        //Récupération des couche WMS
        async function loadLayers() {

    const url = 'http://100.81.197.4:8080/geoserver/rest/workspaces/webmapping/layers.json';
    const auth = btoa('admin:geoserver'); // ⚠️ dev uniquement

    const select = document.getElementById('layerSelect');
    if (!select) {
        console.error("Select layerSelect introuvable dans le DOM");
        return;
    }

    select.innerHTML = '<option>Chargement...</option>';

    try {
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Authorization': `Basic ${auth}`,
                'Accept': 'application/json'
            }
        });

        if (!response.ok) throw new Error("Erreur serveur");

        const data = await response.json();
        const layers = data.layers.layer;

        select.innerHTML = '';

        if (layers && layers.length > 0) {
            layers.forEach(layer => {
                const option = document.createElement('option');
                option.value = layer.name;
                option.textContent = layer.name;
                select.appendChild(option);
            });
        } else {
            select.innerHTML = '<option disabled>Aucune couche trouvée</option>';
        }

    } catch (error) {
        console.error("Erreur:", error);
        select.innerHTML = '<option disabled>Erreur de connexion</option>';
    }
}
      
let wfsLayer = null; // Pour pouvoir effacer le polygone précédent
async function addWFSLayer(lat, lon, layerName) {
    const baseURL = "http://100.81.197.4:8080/geoserver/webmapping/wfs";

    // CORRECTION 1 : L'ordre est Longitude puis Latitude dans POINT()
    const cqlFilter = `INTERSECTS(geom, SRID=4326;POINT(${lat} ${lon}))`;

    const params = new URLSearchParams({
        service: 'WFS',
        version: '2.0.0',
        request: 'GetFeature',
        typeNames: `webmapping:${layerName}`, // Utilise le nom dynamique
        outputFormat: 'application/json',
        CQL_FILTER: cqlFilter
    });

    try {
        const response = await fetch(`${baseURL}?${params.toString()}`);
        const data = await response.json();
        // Nettoyage si un polygone existe déjà
        if (wfsLayer) map.removeLayer(wfsLayer);
        console.log(data.features[0]);

        if (data.features && data.features.length > 0) {
            // CORRECTION 2 : On stocke dans la variable globale et on utilise L.geoJSON
            const layer = L.geoJSON(data, {
                style: {
                    color: 'red',
                    weight: 3,
                    fillOpacity : 1
                }

            }).addTo(map);

            // Centrer la carte sur le résultat
          //  map.fitBounds(wfsLayer.getBounds());
          console.log("Zone affichée :", data.features[0].properties.nom_zone);            
        } else {
            alert("Aucune donnée trouvée à cet emplacement pour cette couche.");
        }
    } catch (error) {
        console.error("Erreur WFS :", error);
    }
}
            // Fonction pour ajouter une couche WMS
        function addWMSLayer() {

                const wmsUrl = document.getElementById('wmsUrl').value;
                const layerName = document.getElementById('layerSelect').value;

                //Calcul Emprise :

                if (!wmsUrl || !layerName) {
                    alert('Veuillez remplir tous les champs');
                    return;
                }

                    //  Supprimer la couche existante si elle existe
                if (wmsLayer) {
                    map.removeLayer(wmsLayer);
                }
                
                // Créer et ajouter la couche WMS
                wmsLayer = L.tileLayer.wms(wmsUrl, {
                    layers: layerName,
                    format: 'image/png',
                    transparent: true,
                    attribution: 'GeoServer',
                    tiled : true,
                    //  bounds:map.getBounds()
                }).addTo(map);
                
                alert('Couche ajoutée !');
            }


                // --- Lancement au chargement de la page ---
                window.addEventListener('DOMContentLoaded', (event) => {
            loadLayers();
                });

            // Affiche des infos On click
                map.on('click', function (e) {

        if (!wmsLayer) return;

        const point = map.latLngToContainerPoint(e.latlng, map.getZoom());
        const size = map.getSize();

        const params = {
            request: 'GetFeatureInfo',
            service: 'WMS',
            srs: 'EPSG:4326',
            styles: '',
            transparent: true,
            version: '1.1.1',
            format: 'image/png',
            bbox: map.getBounds().toBBoxString(),
            height: size.y,
            width: size.x,
            layers: wmsLayer.options.layers,
            query_layers: wmsLayer.options.layers,
            info_format: 'application/json',
            x: Math.floor(point.x),
            y: Math.floor(point.y)
        };

        const url = wmsLayer._url + L.Util.getParamString(params);

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.features && data.features.length > 0) {
                    const props = data.features[0].properties;

                    let content = '<b>Informations :</b><br>';
                    for (let key in props) {
                        content += `${key} : ${props[key]}<br>`;
                    }

                    L.popup()
                        .setLatLng(e.latlng)
                        .setContent(content)
                        .openOn(map);
                }
            });
        });


    </script>
</body>
</html>
