<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur WMS GeoServer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 350px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            display: block;
            margin-top: 8px;
        }
        h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="controls">
        <h3>Ajouter une couche WMS</h3>
        
        <label>URL du serveur WMS :</label>
        <input type="text" id="wmsUrl" placeholder="http://localhost:8080/geoserver">
        
        <label>Nom de la couche :</label>
        <input type="text" id="layerName" placeholder="workspace:layername">
        
        <button onclick="addWMSLayer()">Ajouter la couche</button>
    </div>

    <script>
        // Initialiser la carte
        const map = L.map('map').setView([43.6108, 3.8767], 10);

        // Ajouter le fond de carte OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Fonction pour ajouter une couche WMS
        function addWMSLayer() {
            const wmsUrl = document.getElementById('wmsUrl').value;
            const layerName = document.getElementById('layerName').value;
            
            if (!wmsUrl || !layerName) {
                alert('Veuillez remplir tous les champs');
                return;
            }
            
            // Créer et ajouter la couche WMS
            L.tileLayer.wms(wmsUrl, {
                layers: layerName,
                format: 'image/png',
                transparent: true,
                attribution: 'GeoServer'
            }).addTo(map);
            
            alert('Couche ajoutée !');
        }
    </script>
</body>
</html>
