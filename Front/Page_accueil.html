<!DOCTYPE html>
<html lang="fr">
<head>
        
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>Bienvenue - Localisation</title>

</head>
<body>
   <div class ="page">
     
    <div class="container1">
        <img src="Logo.png" alt="Logo de GeoWarning">
        <h1> Êtes-vous en danger actuellement ? </h1>
        <h2>Où êtes vous ? 📍</h2>
        
        <div class="input-group">   
            <input type="text" id="adresseInput" placeholder="Saisir une adresse..." />

            
            <button id="btnGps" class="btn-gps" title="Utiliser la position de l'appareil">
                📡
            </button>
        </div>

        <div id="status">En attente de localisation...</div>
        
        <button id="btnContinuer" class="btn-valider" disabled>
            CONTINUER
        </button>
    </div>
    <div class="container2">
        <div class ="apropos">
            <h2> À propos de GeoWarning</h2>
            <p>
                GeoWarning est une application permettant d’évaluer rapidement
                les risques potentiels selon votre localisation.
            </p>
            <a href="Dossier_Webmapping_MARTIN_PUGET.pdf" target="_blank" class="lien-pdf">
                En savoir plus
            </a>
            
            <p class = "note">
            ⚠️ Ne remplace pas les services d’urgence.
            </p>
    </div>
   </div>

    <script>
        // --- VARIABLE GLOBALE DE STOCKAGE ---
        // C'est ici que sont stockées les coordonnées finales
        let userLocation = {
            lat: null,
            lon: null,
            source: null // 'GPS' ou 'Adresse'
        };

        // Éléments du DOM
        const adresseInput = document.getElementById('adresseInput');
        const btnGps = document.getElementById('btnGps');
        const statusDiv = document.getElementById('status');
        const btnContinuer = document.getElementById('btnContinuer');

        // --- 1. FONCTION DE MISE À JOUR DE LA VARIABLE ---
        function updateLocation(lat, lon, src) {
            // Mise à jour de la variable
            userLocation.lat = lat;
            userLocation.lon = lon;
            userLocation.source = src;

            // Feedback visuel
            console.log("Coordonnées stockées :", userLocation);
            statusDiv.innerHTML = `Localisé via <b>${src}</b> <br> (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
            statusDiv.className = 'success';
            
            // On active le bouton suite
            btnContinuer.disabled = false;
        }

        // --- 2. LOGIQUE GPS (Navigateur) ---
        btnGps.addEventListener('click', () => {
            if (!navigator.geolocation) {
                statusDiv.innerText = "Erreur : GPS non supporté par ce navigateur.";
                return;
            }

            statusDiv.innerText = "Recherche satellite en cours...";
            statusDiv.className = '';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Succès
                    updateLocation(position.coords.latitude, position.coords.longitude, 'GPS');
                    // Optionnel : Vider le champ adresse pour éviter la confusion
                    adresseInput.value = "Ma position actuelle"; 
                },
                (error) => {
                    // Erreur
                    statusDiv.innerText = "Impossible de vous localiser (Autorisation refusée ?).";
                    statusDiv.className = 'error';
                    console.error(error);
                }
            );
        });

        // --- 3. LOGIQUE ADRESSE (API Nominatim) ---
        // Déclenchement quand on appuie sur Entrée dans le champ
        adresseInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                chercherAdresse();
            }
        });

         function chercherAdresse() {
            const query = adresseInput.value;
            if (query.length < 3) return;

            statusDiv.innerText = "Recherche de l'adresse...";
            
            fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query))
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        updateLocation(lat, lon, 'Adresse');
                    } else {
                        statusDiv.innerText = "Adresse introuvable.";
                        statusDiv.className = 'error';
                        userLocation.lat = null; // Reset si erreur
                        btnContinuer.disabled = true;
                    }
                })
                .catch(err => {
                    statusDiv.innerText = "Erreur de connexion.";
                    console.error(err);
                });
        }

        // --- 4. ACTION FINALE ---
        btnContinuer.addEventListener('click', () => {
            alert(`C'est parti ! \nDestination : ${userLocation.lat}, ${userLocation.lon}`);
            // ICI : Tu pourras rediriger vers ta carte ou envoyer les données
            if ( userLocation.lat && userLocation.lon){
                const adresse = encodeURIComponent(adresseInput.value);
                window.location.href = `Afficheur_carte.html?lat=${userLocation.lat}&lon=${userLocation.lon}&adresse=${adresse}`;
            }
        });


    </script>
</body>
</html>
